# Nightly assurance (REQ-117 / REQ-118 / REQ-288). Two jobs:
#   orphan-audit — the register ↔ code diff, which needs no credentials and always runs.
#   backup       — exports EVERY tenant and control D1, writes a SHA-256 manifest, and retains it for the
#                  policy window. Cloudflare credentials are external (OIDC / repository secrets); when
#                  they are absent the job exits BLOCKED (2), it does NOT pass. A backup job that goes
#                  green without producing a backup is how you discover, on the day you need it, that
#                  there is nothing to restore.
# Every action is pinned to an immutable commit SHA with its release tag in the trailing comment.
name: nightly
on:
  schedule: [{ cron: "0 8 * * *" }]
  workflow_dispatch:

env:
  # The retention policy the preflight enforces (tools/deploy/preflight.ts BACKUP_RETENTION_DAYS).
  BACKUP_RETENTION_DAYS: "30"

jobs:
  orphan-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: register ↔ code orphan diff (REQ-118)
        run: pnpm check:traceability

  backup:
    runs-on: ubuntu-latest
    env:
      # STAGING ONLY, deliberately and for now. `tools/deploy/backup.ts` takes --env and derives either
      # environment's six databases, so backing production up is `pnpm backup -- --env prod` — but
      # SCHEDULING that is an operator decision (which account's token, which retention, whose pager when
      # it goes red), not a default this file may take on their behalf. Until it is scheduled,
      # `preflight --env prod` keeps reporting no-backup for production, which is the truth.
      RELEASE_ENVIRONMENT: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ONE implementation: tools/deploy/backup.ts. This job used to carry its own inline loop over four
      # HARDCODED staging database names — a list that had already drifted from the configs it claimed to
      # describe (staging has six databases, not four; production has six too, with different names). The
      # tool DERIVES the set from every committed [env.<env>] scope, refuses to write a manifest over a
      # partial export, emits its own ##SHUDDL-GATE## line, and exits 2 (BLOCKED, never a green) when the
      # credentials are absent — the same posture this job took by hand, now unit-tested offline in
      # tools/deploy/backup.test.ts.
      - name: export every tenant and control database, then write the SHA-256 manifest
        run: pnpm -s backup -- --env "${RELEASE_ENVIRONMENT}" --out artifacts/backup --mode release

      - name: show the manifest
        run: cat artifacts/backup/manifest.json

      - name: retain the backup for the policy window
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d1-backup-${{ github.run_id }}
          path: artifacts/backup/**
          retention-days: 30
          if-no-files-found: error

# Naming per genesis/14 §02: shuddl-{svc}-{env}. NO SECRETS EVER IN THIS FILE (REQ-154, REQ-134).
# Secrets (JWT_SECRET, ...) live in `wrangler secret` + GitHub Actions OIDC.
name = "shuddl-api-dev"
main = "src/index.ts"
compatibility_date = "2025-08-01"

[vars]
ENVIRONMENT = "dev"

# WP-01 test tenants. Per-tenant D1 is physical isolation (genesis/14 §02: shuddl-t-{slug}-{env}).
[[d1_databases]]
binding = "TENANT_A_DB"
database_name = "shuddl-t-tenant-a-dev"
database_id = "local-tenant-a"

[[d1_databases]]
binding = "TENANT_B_DB"
database_name = "shuddl-t-tenant-b-dev"
database_id = "local-tenant-b"

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "shuddl-control-dev"
database_id = "local-control"

# WP-14 Task 1 (REQ-123/025): the reserved PLATFORM revenue tenant's OWN D1. A DISTINCT binding from the
# customer tenant DBs and the control plane — reached ONLY server-side (resolvePlatformTenantDb), never the
# customer allowlist. PLG DARK: provisioned at R4; the local id keeps tests + `wrangler dev` self-contained.
[[d1_databases]]
binding = "PLATFORM_TENANT_DB"
database_name = "shuddl-t-platform-dev"
database_id = "local-platform"

# WP-14 Task 2 (REQ-121/025): the pre-provisioned tenant-D1 POOL for DARK dynamic provisioning. Bindings are
# static in a Worker, so self-serve signup CLAIMS one of these already-migrated slots (provisionTenant); it can
# never mint a binding. Reached ONLY server-side (resolveClaimedTenantDb / the claim) — NEVER the customer
# TENANT_BINDINGS allowlist, so the REQ-025 ISO-pub-5 subset-parity is untouched. PLG DARK: the flag is OFF
# until R4; the local ids keep tests + `wrangler dev` self-contained. Grow the pool = add a slot here + a row.
[[d1_databases]]
binding = "TENANT_POOL_01_DB"
database_name = "shuddl-t-pool-01-dev"
database_id = "local-pool-01"

[[d1_databases]]
binding = "TENANT_POOL_02_DB"
database_name = "shuddl-t-pool-02-dev"
database_id = "local-pool-02"

[[kv_namespaces]]
binding = "IDEMPOTENCY"
id = "local-idempotency"

# Evidence store: anchor receipts (.tsr) + manifests, and (later) POD photos (REQ-014).
[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "shuddl-evidence-dev"

# Ledger sequencer: one DO per (tenant|stream). Assigns seq/prev_hash, verifies the device
# signature, enforces the invoice gate, and writes the event + every projection in one batch.
[[durable_objects.bindings]]
name = "SHIPMENT_SEQ"
class_name = "ShipmentSequencer"

[[migrations]]
tag = "v2-sequencer"
new_sqlite_classes = ["ShipmentSequencer"]

# WP-06 (REQ-031/039): agent triggers. A committed pod.signed fans out to the agents worker's Biller
# consumer through this queue (producer here; consumer in workers/agents/wrangler.toml).
[[queues.producers]]
binding = "AGENT_QUEUE"
queue = "shuddl-agent-triggers-dev"

# staging = synthetic tenants only, no real PII, ever (REQ-154). Real resources (created 2026-07-14);
# the default (top-level) config keeps its local-* ids for tests + `wrangler dev` and is untouched.
[env.staging]
name = "shuddl-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

# Staging needs a reachable hostname for the same reason prod does: `tools/deploy/staging-smoke.ts`
# drives a real POD->invoice chain over HTTPS through the DEPLOYED api, and an unrouted worker cannot
# be smoked. Routing staging is also what keeps that proof OFF the production ledger — prod events are
# append-only, so a synthetic smoke shipment there would be permanent.
# SINGLE-level host on purpose: Cloudflare universal TLS covers `*.shuddl.tech` but NOT a second label,
# so `api.staging.shuddl.tech` fails the handshake while `api-staging.shuddl.tech` works.
[[env.staging.routes]]
pattern = "api-staging.shuddl.tech/*"
zone_name = "shuddl.tech"

[[env.staging.d1_databases]]
binding = "TENANT_A_DB"
database_name = "shuddl-t-tenant-a-staging"
database_id = "1742fef3-f7bf-4d1a-9aaa-bf9366994528"

[[env.staging.d1_databases]]
binding = "TENANT_B_DB"
database_name = "shuddl-t-tenant-b-staging"
database_id = "aa3b23a8-567d-4479-8311-e9f1678a6797"

[[env.staging.d1_databases]]
binding = "CONTROL_DB"
database_name = "shuddl-control-staging"
database_id = "8e238970-2ed3-494d-960f-e4af082c1e8e"

# WP-14 Task 1 (REQ-123/025): reserved PLATFORM tenant D1 (PLG DARK — real resource provisioned at R4). The
# placeholder id is intentional: WP-14 ships fail-closed, and no code path binds this in staging until R4.
[[env.staging.d1_databases]]
binding = "PLATFORM_TENANT_DB"
database_name = "shuddl-t-platform-staging"
database_id = "ebbcd4f9-fc66-4529-a3aa-de51fc67bc8f"

# WP-14 Task 2 (REQ-121/025): the tenant-D1 POOL (PLG DARK — real resources pre-provisioned at R4). The
# placeholder ids are intentional: WP-14 ships fail-closed and no code path binds these in staging until R4.
[[env.staging.d1_databases]]
binding = "TENANT_POOL_01_DB"
database_name = "shuddl-t-pool-01-staging"
database_id = "6f087baf-ae70-4c6c-8ef4-79ae42b5e939"

[[env.staging.d1_databases]]
binding = "TENANT_POOL_02_DB"
database_name = "shuddl-t-pool-02-staging"
database_id = "fbebe252-f33b-4ac7-b3f6-4d775e036ef5"

[[env.staging.kv_namespaces]]
binding = "IDEMPOTENCY"
id = "119880a9442c4b8cae8383183a2877e1"

[[env.staging.r2_buckets]]
binding = "EVIDENCE"
bucket_name = "shuddl-evidence-staging"

[[env.staging.durable_objects.bindings]]
name = "SHIPMENT_SEQ"
class_name = "ShipmentSequencer"

[[env.staging.migrations]]
tag = "v2-sequencer"
new_sqlite_classes = ["ShipmentSequencer"]

[[env.staging.queues.producers]]
binding = "AGENT_QUEUE"
queue = "shuddl-agent-triggers-staging"

# ── PRODUCTION ────────────────────────────────────────────────────────────────────────────────────────
# Wrangler does NOT inherit top-level bindings into a named environment, so this scope declaring only a
# name meant `wrangler deploy --env prod` would have shipped a worker with ZERO bindings — every
# `env.TENANT_A_DB` undefined at the first request. It is now structurally complete.
#
# ~~EVERY id here is an all-zero placeholder~~ SUPERSEDED 2026-07-30 — provisioned; ids are real. Nothing in this repo can invent a Cloudflare
# resource id, so the honest state is "declared, not provisioned", and the preflight must keep BLOCKING
# on it (placeholder-resource-id) until an operator provisions the resources and replaces these. Filling
# them with plausible-looking values is the exact failure this file just had in billing's staging scope,
# where a well-formed random UUID made a non-existent database read as provisioned.
#
# [env.prod] IS NOW DEPLOYED (api.shuddl.tech). Superseded 2026-07-30. The shape stayed checkable: the shape is now checkable at merge time
# (tools/deploy/wrangler-scope-parity.test.ts), and the provisioning hold is visible instead of hidden
# behind an empty scope.
[env.prod]
name = "shuddl-api-prod"
workers_dev = false

[env.prod.vars]
ENVIRONMENT = "prod"

# The public API surface. Command, Portal and the Driver PWA are browser clients on their own origins,
# so every /v1 read is cross-origin and gated by CORS_ALLOWED_ORIGINS (never `*`).
[[env.prod.routes]]
pattern = "api.shuddl.tech/*"
zone_name = "shuddl.tech"

[[env.prod.d1_databases]]
binding = "TENANT_A_DB"
database_name = "shuddl-t-tenant-a-prod"
database_id = "7fb36070-86b3-4673-8bc9-de08ac0fa363"

[[env.prod.d1_databases]]
binding = "TENANT_B_DB"
database_name = "shuddl-t-tenant-b-prod"
database_id = "c6752655-df5b-4b8c-b150-95b04c990e99"

[[env.prod.d1_databases]]
binding = "CONTROL_DB"
database_name = "shuddl-control-prod"
database_id = "e91b8e7c-c878-437d-b25d-34530280fe85"

[[env.prod.d1_databases]]
binding = "PLATFORM_TENANT_DB"
database_name = "shuddl-t-platform-prod"
database_id = "a79a005f-6cef-48d6-9f36-1fcb887eea87"

[[env.prod.d1_databases]]
binding = "TENANT_POOL_01_DB"
database_name = "shuddl-t-pool-01-prod"
database_id = "dafdbec9-ebc5-4db7-9306-db96a0b3021f"

[[env.prod.d1_databases]]
binding = "TENANT_POOL_02_DB"
database_name = "shuddl-t-pool-02-prod"
database_id = "20564820-573d-425b-8803-41fc984096d0"

# (Historical: this id was deliberately non-32-hex while unprovisioned, so a shape-only check could not
# mistake it for real. It is now the real namespace id.) A KV id is only checked for shape, so an all-zero 32-hex string would PASS the
# placeholder check and read as provisioned — the same trap the billing UUID set. This one blocks.
[[env.prod.kv_namespaces]]
binding = "IDEMPOTENCY"
id = "24c3937963654249a4ad4ac971ce74c1"

[[env.prod.r2_buckets]]
binding = "EVIDENCE"
bucket_name = "shuddl-evidence-prod"

[[env.prod.durable_objects.bindings]]
name = "SHIPMENT_SEQ"
class_name = "ShipmentSequencer"

[[env.prod.migrations]]
tag = "v2-sequencer"
new_sqlite_classes = ["ShipmentSequencer"]

[[env.prod.queues.producers]]
binding = "AGENT_QUEUE"
queue = "shuddl-agent-triggers-prod"

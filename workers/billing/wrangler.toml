# Naming per genesis/14 §02: shuddl-{svc}-{env}. NO SECRETS EVER IN THIS FILE (REQ-154, REQ-134).
# WP-14 Task 6 (REQ-123) — THE BILLING WORKER: the cross-DB METERING RECOMPUTE SWEEP. The metered unit is the
# AI action = the frozen `agent.acted` event; `agent_runs` is already the idempotent one-row-per-`agent.acted`
# meter (INSERT OR IGNORE on the event id), so COUNT(agent_runs) == COUNT(agent.acted) EXACTLY. The events
# ledger is per-tenant D1; usage_credits is control-plane D1 (a SEPARATE database) — so the metering write
# CANNOT ride the sequencer's single-DB batch. This cron RECOMPUTES {agent: count} per (tenant, period) from
# each tenant's ledger and OVERWRITES usage_credits.metered (a full replace, never a += → drift-free).
name = "shuddl-billing-dev"
main = "src/index.ts"
compatibility_date = "2025-08-01"
# Cron-only worker. Keep it off the auto *.workers.dev subdomain — no public HTTP surface ships (the fetch
# handler is a health probe only). The recompute is driven by scheduled(), never a route.
workers_dev = false

[vars]
ENVIRONMENT = "dev"

# REQ-123 — the metering recompute runs hourly. The sweep is a full recompute-from-ledger that OVERWRITES the
# period blob (idempotent by construction — a re-run yields the identical result, never a double-count), so the
# cadence is a freshness knob, not a correctness one: re-running each hour is always safe.
[triggers]
crons = ["0 * * * *"]

# Per-tenant D1 (mirror workers/api/src/tenants.ts TENANT_BINDINGS + workers/translator/wrangler.toml; parity
# is CI-enforced). Physical isolation. The sweep READS each tenant's `agent_runs`⋈`events` — it never writes
# tenant D1 (no event append). The reserved `_platform` revenue tenant + pool sentinels are NOT bound here —
# they are never metered as customers (REQ-025).
[[d1_databases]]
binding = "TENANT_A_DB"
database_name = "shuddl-t-tenant-a-dev"
database_id = "local-billing-tenant-a"

[[d1_databases]]
binding = "TENANT_B_DB"
database_name = "shuddl-t-tenant-b-dev"
database_id = "local-billing-tenant-b"

# Control plane (usage_credits — the metering OVERWRITE target; tenants roster). A SEPARATE database from any
# tenant D1 — this is exactly WHY the metering write is a scheduled recompute and not a sequencer batch. The
# sweep WRITES only each customer tenant's OWN usage_credits row (tenant-scoped id `<tenant>:<period>`); it is
# never a tenant DATA path (REQ-025). Mirrors workers/api + workers/translator CONTROL_DB.
[[d1_databases]]
binding = "CONTROL_DB"
database_name = "shuddl-control-dev"
database_id = "local-billing-control"


# 2026-08-01 §12 (REQ-121/123/025) — claimed-tenant pool planes; staging/prod ids VERBATIM from
# workers/api (same physical databases). Dev ids are worker-local aliases, like every other dev binding here.
[[d1_databases]]
binding = "TENANT_POOL_01_DB"
database_name = "shuddl-t-pool-01-dev"
database_id = "local-billing-pool-01"

[[d1_databases]]
binding = "TENANT_POOL_02_DB"
database_name = "shuddl-t-pool-02-dev"
database_id = "local-billing-pool-02"

# WP-14 Task 7 (REQ-123/154) — the reserved PLATFORM revenue tenant's OWN D1, where credits append as money
# events (invoice.issued kind='credit_purchase' → payment.received). A DISTINCT database, NOT in the customer
# allowlist above and NOT the control plane, resolved SERVER-SIDE only (resolvePlatformTenantDb — no slug input),
# so no customer path can reach it (REQ-025). NO SECRETS here — the Stripe webhook secret is operator-injected
# via `wrangler secret` (REQ-154). Mirrors workers/api PLATFORM_TENANT_DB.
[[d1_databases]]
binding = "PLATFORM_TENANT_DB"
# ONE logical binding, ONE physical database. The `_platform` spelling here was a second, non-existent
# database: control-plane slugs carry a leading underscore (db/control/migrations/0003_tenant_pool.sql),
# but the deployed d1 name drops it — `_pool_01` is `shuddl-t-pool-01-dev` in workers/api. Nothing reads
# `database_name` at runtime (both resolvers return the binding object), so the underscore bought nothing
# and cost a divergent target.
database_name = "shuddl-t-platform-dev"
database_id = "local-billing-platform"

# WP-14 Task 10 (REQ-123/025) — the api worker service binding. Task 10 appends credit money events onto
# `_platform` through the REAL sequencer over this binding (SequencerPlatformLedger → the api worker's internal,
# secret-gated platform-credit route), retiring the interim D1 mirror. Mirrors workers/mcp's API binding + the
# cross-script bindings the translator/agents workers use to reach the api worker. NO SECRETS — the internal
# shared secret (PLATFORM_INTERNAL_SECRET) is a `wrangler secret`, never this toml (REQ-154).
[[services]]
binding = "API"
service = "shuddl-api-dev"

# ── STAGING (synthetic only, REQ-154). Real resources mirror the api/agents/translator staging ids; the
#    default (top-level) config keeps its local-* ids for tests + `wrangler dev`. NO secrets — the recompute
#    reads/writes only D1, so there is nothing to gate.
[env.staging]
name = "shuddl-billing-staging"
workers_dev = false

[env.staging.vars]
ENVIRONMENT = "staging"

[env.staging.triggers]
crons = ["0 * * * *"]

# Same physical tenant DBs as the api/agents/translator workers (ids MUST match workers/api [env.staging]).
[[env.staging.d1_databases]]
binding = "TENANT_A_DB"
database_name = "shuddl-t-tenant-a-staging"
database_id = "1742fef3-f7bf-4d1a-9aaa-bf9366994528"

[[env.staging.d1_databases]]
binding = "TENANT_B_DB"
database_name = "shuddl-t-tenant-b-staging"
database_id = "aa3b23a8-567d-4479-8311-e9f1678a6797"

# Control plane (must match workers/api [env.staging] CONTROL_DB id).
[[env.staging.d1_databases]]
binding = "CONTROL_DB"
database_name = "shuddl-control-staging"
database_id = "8e238970-2ed3-494d-960f-e4af082c1e8e"


# 2026-08-01 §12 (REQ-121/123/025) — claimed-tenant pool planes; staging/prod ids VERBATIM from
# workers/api (same physical databases). Dev ids are worker-local aliases, like every other dev binding here.
[[env.staging.d1_databases]]
binding = "TENANT_POOL_01_DB"
database_name = "shuddl-t-pool-01-staging"
database_id = "6f087baf-ae70-4c6c-8ef4-79ae42b5e939"

[[env.staging.d1_databases]]
binding = "TENANT_POOL_02_DB"
database_name = "shuddl-t-pool-02-staging"
database_id = "fbebe252-f33b-4ac7-b3f6-4d775e036ef5"

# Reserved PLATFORM revenue tenant D1 (must match workers/api [env.staging] PLATFORM_TENANT_DB id). Synthetic
# staging id (REQ-154); the credit ledger lives here. NO secrets — the Stripe webhook secret is a `wrangler secret`.
[[env.staging.d1_databases]]
binding = "PLATFORM_TENANT_DB"
database_name = "shuddl-t-platform-staging"
# The id is the api worker's id VERBATIM — the binding must converge (preflight compares name|id, so a
# matching name alone would not clear the drift). History this line carries: it was once a well-formed
# RANDOM UUID that read as provisioned while api's placeholder was correctly flagged — the fix was to
# mirror api exactly, placeholder or real. ~~No platform D1 exists in staging; the gate must keep saying
# so~~ superseded 2026-07-31: the shared id below is a REAL provisioned database (commit b961dfc).
database_id = "ebbcd4f9-fc66-4529-a3aa-de51fc67bc8f"

# WP-14 Task 10 (REQ-123/025) — the api worker service binding targets the STAGING api worker (must be deployed).
# The credit flow appends through its real sequencer over this binding. NO secrets in this toml (REQ-154).
[[env.staging.services]]
binding = "API"
service = "shuddl-api-staging"

# ── PRODUCTION ────────────────────────────────────────────────────────────────────────────────────────
# Structurally mirrors [env.staging]; ids were all-zero placeholders until 2026-07-30; they are now real (the preflight blocked
# until an operator provisions the resources. ~~NOT deployable — declared, not provisioned.~~ PROVISIONED AND DEPLOYED 2026-07-30; ids are real. NO SECRETS
# here: STRIPE_WEBHOOK_SECRET and PLATFORM_INTERNAL_SECRET are operator-injected via `wrangler secret`
# and are now required by the preflight contract (REQ-154).
[env.prod]
name = "shuddl-billing-prod"
workers_dev = false

[env.prod.vars]
ENVIRONMENT = "prod"

# Stripe must be able to REACH the credit-purchase webhook (POST /webhooks/stripe), so this worker needs
# a route even though it is otherwise cron-driven. The handler answers /health and that one path; every
# other request 404s, and the webhook itself stays DARK until STRIPE_WEBHOOK_SECRET is bound.
[[env.prod.routes]]
pattern = "billing.shuddl.tech/*"
zone_name = "shuddl.tech"

[env.prod.triggers]
crons = ["0 * * * *"]

# Same physical tenant DBs as the api/agents/translator workers (ids MUST match workers/api [env.prod]).
[[env.prod.d1_databases]]
binding = "TENANT_A_DB"
database_name = "shuddl-t-tenant-a-prod"
database_id = "7fb36070-86b3-4673-8bc9-de08ac0fa363"

[[env.prod.d1_databases]]
binding = "TENANT_B_DB"
database_name = "shuddl-t-tenant-b-prod"
database_id = "c6752655-df5b-4b8c-b150-95b04c990e99"

[[env.prod.d1_databases]]
binding = "CONTROL_DB"
database_name = "shuddl-control-prod"
database_id = "e91b8e7c-c878-437d-b25d-34530280fe85"


# 2026-08-01 §12 (REQ-121/123/025) — claimed-tenant pool planes; staging/prod ids VERBATIM from
# workers/api (same physical databases). Dev ids are worker-local aliases, like every other dev binding here.
[[env.prod.d1_databases]]
binding = "TENANT_POOL_01_DB"
database_name = "shuddl-t-pool-01-prod"
database_id = "dafdbec9-ebc5-4db7-9306-db96a0b3021f"

[[env.prod.d1_databases]]
binding = "TENANT_POOL_02_DB"
database_name = "shuddl-t-pool-02-prod"
database_id = "20564820-573d-425b-8803-41fc984096d0"

# ONE logical binding, ONE physical database — the id MUST match workers/api [env.prod].
[[env.prod.d1_databases]]
binding = "PLATFORM_TENANT_DB"
database_name = "shuddl-t-platform-prod"
database_id = "a79a005f-6cef-48d6-9f36-1fcb887eea87"

[[env.prod.services]]
binding = "API"
service = "shuddl-api-prod"

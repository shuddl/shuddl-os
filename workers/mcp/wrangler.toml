# Naming per genesis/14 §02: shuddl-{svc}-{env}. NO SECRETS EVER IN THIS FILE (REQ-154, REQ-134).
# WP-13 Task 1 (REQ-101) — THE MCP WORKER SCAFFOLD. It exposes NO tool/MCP/OAuth surface yet (those land in
# later tasks); this task ships the api SERVICE-BINDING REUSE SEAM. Every future MCP tool reaches freight
# reality ONLY through the api worker's authenticated /v1/* routes (callApi → env.API.fetch), so the api's
# server-side gates (REQ-030) run for an MCP caller exactly as for a browser caller — no second gate, no bypass.
name = "shuddl-mcp-dev"
main = "src/index.ts"
compatibility_date = "2025-08-01"
# No auto *.workers.dev subdomain — the MCP + OAuth endpoints are exposed via an explicit route only (a later
# task). No public HTTP surface ships in this task (the fetch handler is a health probe).
workers_dev = false

[vars]
ENVIRONMENT = "dev"

# WP-13 Task 10 (REQ-109) — the outbound webhook DELIVERY CRON. The `scheduled` handler runs runWebhookSweep,
# which is FAIL-CLOSED by construction (a NotConfigured event source yields nothing + a NotConfigured
# transport/secret resolver deliver nothing), so this tick is a safe no-op until the live ledger/queue event
# feed + the signing-secret store are wired (documented go-live items — see webhooks.ts). Adding no table/kind.
[triggers]
crons = ["*/5 * * * *"]

# THE REUSE SEAM: a service binding to the api worker (its Hono app + every /v1 gate). callApi() routes
# THROUGH this binding, so an MCP tool can never touch a physical fact except through the api's server-side
# gates (REQ-030/101). In-process (no Internet hop). Mirrors the cross-script bindings the translator/agents
# workers already hold to `shuddl-api-dev`.
[[services]]
binding = "API"
service = "shuddl-api-dev"

# Control plane (tenants + `pairings` — the OAuth grant target). Auth-only; NEVER a tenant data path (REQ-025).
# Mirrors workers/api + workers/translator CONTROL_DB.
[[d1_databases]]
binding = "CONTROL_DB"
database_name = "shuddl-control-dev"
database_id = "local-control"

# WP-13 Task 2 (REQ-102) — the OAuth grants store: authorization codes, access-token→pairing grants, and
# registered clients (all opaque). A SessionClaims JWT is NEVER stored here — it is minted per request (REQ-102).
[[kv_namespaces]]
binding = "GRANTS"
id = "local-grants"

# WP-13 Task 8 (REQ-105) — the per-actor usage counter (spend/velocity caps). One DO per ACTING pairing
# (idFromName(pairingId)); it maintains the mcp worker's own tally because the ledger does not record the acting
# pairing. A Durable Object is NOT a D1 table — the 22-table ceiling (check:invariants) is untouched.
[[durable_objects.bindings]]
name = "CAPS_METER"
class_name = "CapsMeter"

[[migrations]]
tag = "v1-caps-meter"
new_sqlite_classes = ["CapsMeter"]

# ── STAGING (synthetic only, REQ-154). The service binding targets the STAGING api worker (must be deployed
#    first); the default (top-level) config keeps its local-* ids for tests + `wrangler dev`.
[env.staging]
name = "shuddl-mcp-staging"
workers_dev = false

[env.staging.vars]
ENVIRONMENT = "staging"

# WP-13 Task 10 (REQ-109) — the webhook delivery cron, mirrored into staging (fail-closed no-op until wired).
[env.staging.triggers]
crons = ["*/5 * * * *"]

# Cross-service → the STAGING api worker (name per the <worker-name>-<environment> service convention).
[[env.staging.services]]
binding = "API"
service = "shuddl-api-staging"

# Control plane (must match workers/api [env.staging] CONTROL_DB id).
[[env.staging.d1_databases]]
binding = "CONTROL_DB"
database_name = "shuddl-control-staging"
database_id = "8e238970-2ed3-494d-960f-e4af082c1e8e"

# OAuth grants store (staging id is a synthetic placeholder; provisioned at deploy — REQ-154).
[[env.staging.kv_namespaces]]
binding = "GRANTS"
id = "0000000000000000000000000000staging"

# Per-actor usage counter (REQ-105) — same DO, mirrored into staging (a DO adds no table).
[[env.staging.durable_objects.bindings]]
name = "CAPS_METER"
class_name = "CapsMeter"

[[env.staging.migrations]]
tag = "v1-caps-meter"
new_sqlite_classes = ["CapsMeter"]

# ── PRODUCTION ────────────────────────────────────────────────────────────────────────────────────────
# Structurally mirrors [env.staging]; every id is an all-zero placeholder so the preflight keeps BLOCKING
# until an operator provisions the resources. NOT deployable — declared, not provisioned.
[env.prod]
name = "shuddl-mcp-prod"
workers_dev = false

[env.prod.vars]
ENVIRONMENT = "prod"

# The MCP + OAuth endpoints. Routed on its own hostname so the OAuth callback and the tool surface are
# addressable without widening the api worker's route.
[[env.prod.routes]]
pattern = "mcp.shuddl.tech/*"
zone_name = "shuddl.tech"

# REQ-109 — the webhook delivery cron (fail-closed no-op until wired).
[env.prod.triggers]
crons = ["*/5 * * * *"]

# Cross-service → the PROD api worker (<worker-name>-<environment> service convention).
[[env.prod.services]]
binding = "API"
service = "shuddl-api-prod"

# Control plane (id MUST match workers/api [env.prod] CONTROL_DB).
[[env.prod.d1_databases]]
binding = "CONTROL_DB"
database_name = "shuddl-control-prod"
database_id = "e91b8e7c-c878-437d-b25d-34530280fe85"

# OAuth grants store. NOT 32-hex on purpose — an all-zero 32-hex id would pass the shape check and read
# as provisioned; this one keeps BLOCKING.
[[env.prod.kv_namespaces]]
binding = "GRANTS"
id = "ff8395f3c05e4240b24690bb9f696cbb"

# Per-actor usage counter (REQ-105) — same DO, mirrored into prod (a DO adds no table).
[[env.prod.durable_objects.bindings]]
name = "CAPS_METER"
class_name = "CapsMeter"

[[env.prod.migrations]]
tag = "v1-caps-meter"
new_sqlite_classes = ["CapsMeter"]

# Naming per genesis/14 §02. NO SECRETS EVER IN THIS FILE (REQ-154).
name = "shuddl-agents-dev"
main = "src/index.ts"
compatibility_date = "2025-08-01"

[vars]
ENVIRONMENT = "dev"
# REQ-129 — the evidence email's referral surface ("Ship like this") points here (owner-fixed base).
REFERRAL_BASE = "https://shuddl.tech"

# REQ-014: daily Merkle -> TSA anchor at 01:00 UTC — a grace window past midnight so the just-closed
# day can no longer grow (late/airplane-mode uploads carry TODAY's recorded_at, not yesterday's).
[triggers]
crons = ["0 1 * * *"]

# Per-tenant D1 (mirror workers/api/src/tenants.ts; parity is CI-enforced). Physical isolation.
[[d1_databases]]
binding = "TENANT_A_DB"
database_name = "shuddl-t-tenant-a-dev"
database_id = "local-agents-tenant-a"

[[d1_databases]]
binding = "TENANT_B_DB"
database_name = "shuddl-t-tenant-b-dev"
database_id = "local-agents-tenant-b"

# Anchor receipts (.tsr) + manifests land in R2.
[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "shuddl-evidence-dev"

# WP-06 (REQ-031/039): the Biller consumer. The api worker's sequencer DO produces a pod.signed
# trigger per committed POD; this worker consumes it (queue() in src/index.ts → src/biller.ts).
# After max_retries the message lands in the DLQ — NEVER deleted: a deterministic bug must leave a
# recoverable record (no invoice AND no trace would be the worst failure). Messages ACCUMULATE there
# until WP-11 Watchtower consumes the DLQ + surfaces the exceptions queue (REQ-036/169).
[[queues.consumers]]
queue = "shuddl-agent-triggers-dev"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "shuddl-agent-dlq-dev"

# The Biller appends invoice.issued THROUGH the api worker's sequencer DO (cross-script binding) so
# the I2 gate + the money projection run atomically there — this worker never writes events itself.
[[durable_objects.bindings]]
name = "SHIPMENT_SEQ"
class_name = "ShipmentSequencer"
script_name = "shuddl-api-dev"

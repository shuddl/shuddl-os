# Naming per genesis/14 §02. NO SECRETS EVER IN THIS FILE (REQ-154).
name = "shuddl-agents-dev"
main = "src/index.ts"
compatibility_date = "2025-08-01"
# The guarded /_dev/evidence-test-send probe must NOT be public-by-default: keep this worker off the
# auto *.workers.dev subdomain (belt-and-suspenders atop flag+token+sink gating). Expose via an explicit
# route only when deliberately testing the live send. This worker's real triggers are the cron + queue.
workers_dev = false

[vars]
ENVIRONMENT = "dev"
# REQ-129 — the evidence email's referral surface ("Ship like this") points here (owner-fixed base).
REFERRAL_BASE = "https://shuddl.tech"

# ── OPERATOR-SET diagnostic: the guarded, dev-only evidence live-send probe (POST /_dev/evidence-test-send,
#    REQ-092 wiring proof). LEFT COMMENTED OUT — the route is INERT (404) until an operator arms it in a
#    dev/staging environment, and it must NEVER be armed in prod. RESEND_API_KEY + EVIDENCE_FROM are the
#    same secrets the Biller uses; TEST_SEND_TOKEN is ALSO a secret — set both via `wrangler secret put`,
#    NEVER in this toml (REQ-154). Only the two NON-secret vars below would ever live here.
# ALLOW_TEST_SEND = "1"                    # arms the probe (any value other than exactly "1" stays inert)
# TEST_SEND_TO = "delivered@resend.dev"    # the SINK recipient (default when unset); point at your OWN inbox to eyeball the email
# TEST_SEND_TOKEN = "<secret>"             # ← DO NOT set here — `wrangler secret put TEST_SEND_TOKEN`

# REQ-014: daily Merkle -> TSA anchor at 01:00 UTC — a grace window past midnight so the just-closed
# day can no longer grow (late/airplane-mode uploads carry TODAY's recorded_at, not yesterday's).
[triggers]
crons = ["0 1 * * *"]

# Per-tenant D1 (mirror workers/api/src/tenants.ts; parity is CI-enforced). Physical isolation.
[[d1_databases]]
binding = "TENANT_A_DB"
database_name = "shuddl-t-tenant-a-dev"
database_id = "local-agents-tenant-a"

[[d1_databases]]
binding = "TENANT_B_DB"
database_name = "shuddl-t-tenant-b-dev"
database_id = "local-agents-tenant-b"

# WP-14 Task 8 (REQ-122/125) — the control plane (tenants.plan = the Spark tier flag; tenants.policy carries the
# per-tenant AI-credit allotment). READ-ONLY here: the Spark convenience cap resolves the plan/allotment; it
# never writes control rows. A SEPARATE database from any tenant D1 (REQ-025). Mirrors workers/api CONTROL_DB.
[[d1_databases]]
binding = "CONTROL_DB"
database_name = "shuddl-control-dev"
database_id = "local-agents-control"

# 2026-08-01 audit C3 (REQ-121/123/025/169) — the claimed-tenant POOL planes, mirroring workers/api. Bound so
# the queue consumers and every cron sweep can serve a CLAIMED pool tenant; resolution is server-side-only
# (control row → pool_binding constrained to the static allowlist in src/tenants.ts). Ids MUST match
# workers/api per env — the two workers address the same physical databases.
[[d1_databases]]
binding = "TENANT_POOL_01_DB"
database_name = "shuddl-t-pool-01-dev"
database_id = "local-agents-pool-01"

[[d1_databases]]
binding = "TENANT_POOL_02_DB"
database_name = "shuddl-t-pool-02-dev"
database_id = "local-agents-pool-02"

# Anchor receipts (.tsr) + manifests land in R2.
[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "shuddl-evidence-dev"

# WP-06 (REQ-031/039): the Biller consumer. The api worker's sequencer DO produces a pod.signed
# trigger per committed POD; this worker consumes it (queue() in src/index.ts → src/biller.ts).
# After max_retries the message lands in the DLQ — NEVER deleted: a deterministic bug must leave a
# recoverable record (no invoice AND no trace would be the worst failure). Messages ACCUMULATE there
# until WP-11 Watchtower consumes the DLQ + surfaces the exceptions queue (REQ-036/169).
[[queues.consumers]]
queue = "shuddl-agent-triggers-dev"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "shuddl-agent-dlq-dev"

# REQ-169: the reconciliation sweep (cron) re-enqueues a LOST pod.signed Biller trigger onto the SAME queue this
# worker consumes (and the api worker's sequencer DO produces to), closing the commit→enqueue gap. So this worker
# is BOTH producer and consumer of the trigger queue. AGENT_QUEUE is the producer binding the sweep sends through.
[[queues.producers]]
queue = "shuddl-agent-triggers-dev"
binding = "AGENT_QUEUE"

# The Biller appends invoice.issued THROUGH the api worker's sequencer DO (cross-script binding) so
# the I2 gate + the money projection run atomically there — this worker never writes events itself.
[[durable_objects.bindings]]
name = "SHIPMENT_SEQ"
class_name = "ShipmentSequencer"
script_name = "shuddl-api-dev"

# WP-14 Task 8 (REQ-122/125) — the per-TENANT Spark convenience meter (one DO per idFromName(tenant)). It caps
# the LLM-powered agent conveniences (Concierge auto-quote) for a Spark tenant over its monthly AI-credit
# allotment; it is NEVER consulted on the physical-truth append path or the Biller invoice ("credits throttle
# conveniences, not truth", genesis/04:15). Defined + owned by THIS worker (re-exported from src/index.ts). A
# Durable Object is NOT a D1 table — the 22-table ceiling (check:invariants) is untouched. Mirrors workers/mcp CapsMeter.
[[durable_objects.bindings]]
name = "SPARK_METER"
class_name = "SparkMeter"

[[migrations]]
tag = "v1-spark-meter"
new_sqlite_classes = ["SparkMeter"]

# ── STAGING (synthetic only, REQ-154). Real resources created 2026-07-14; the default above keeps its
#    local-* ids for tests + `wrangler dev`. RESEND_API_KEY / EVIDENCE_FROM / ALLOW_TEST_SEND are
#    DELIBERATELY ABSENT here — the Biller uses NotConfiguredSender, so NO evidence email is ever sent
#    from this deployment (real send stays gated) and the /_dev probe stays inert.
[env.staging]
name = "shuddl-agents-staging"
workers_dev = false

[env.staging.vars]
ENVIRONMENT = "staging"
REFERRAL_BASE = "https://shuddl.tech"
# GO-LIVE (2026-07-14): staging evidence sending is ON. With RESEND_API_KEY (secret, scoped to
# send.shuddl.tech) + this EVIDENCE_FROM both present, evidenceSender() returns ResendSender. Staging
# tenants are synthetic, so real email only goes to whatever recipient a shipment's party carries.
EVIDENCE_FROM = "SHUDDL <pod@send.shuddl.tech>"

[env.staging.triggers]
crons = ["0 1 * * *"]

# Same physical tenant DBs as the api worker (ids MUST match workers/api [env.staging]).
[[env.staging.d1_databases]]
binding = "TENANT_A_DB"
database_name = "shuddl-t-tenant-a-staging"
database_id = "1742fef3-f7bf-4d1a-9aaa-bf9366994528"

[[env.staging.d1_databases]]
binding = "TENANT_B_DB"
database_name = "shuddl-t-tenant-b-staging"
database_id = "aa3b23a8-567d-4479-8311-e9f1678a6797"

# WP-14 Task 8 (REQ-122/125) — the control plane (Spark plan flag + allotment). Read-only; id MUST match
# workers/api + workers/billing [env.staging] CONTROL_DB.
[[env.staging.d1_databases]]
binding = "CONTROL_DB"
database_name = "shuddl-control-staging"
database_id = "8e238970-2ed3-494d-960f-e4af082c1e8e"

# 2026-08-01 audit C3 — claimed-tenant pool planes; ids VERBATIM from workers/api [env.staging] (same
# physical databases — the convergence rule the billing PLATFORM binding established).
[[env.staging.d1_databases]]
binding = "TENANT_POOL_01_DB"
database_name = "shuddl-t-pool-01-staging"
database_id = "6f087baf-ae70-4c6c-8ef4-79ae42b5e939"

[[env.staging.d1_databases]]
binding = "TENANT_POOL_02_DB"
database_name = "shuddl-t-pool-02-staging"
database_id = "fbebe252-f33b-4ac7-b3f6-4d775e036ef5"

[[env.staging.r2_buckets]]
binding = "EVIDENCE"
bucket_name = "shuddl-evidence-staging"

[[env.staging.queues.consumers]]
queue = "shuddl-agent-triggers-staging"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "shuddl-agent-dlq-staging"

# REQ-169 — the reconciliation sweep's re-enqueue producer (see the dev binding above).
[[env.staging.queues.producers]]
queue = "shuddl-agent-triggers-staging"
binding = "AGENT_QUEUE"

# Cross-script DO → the STAGING api worker (must be deployed first).
[[env.staging.durable_objects.bindings]]
name = "SHIPMENT_SEQ"
class_name = "ShipmentSequencer"
script_name = "shuddl-api-staging"

# WP-14 Task 8 (REQ-122/125) — the per-tenant Spark convenience meter, owned by THIS worker (see the dev binding).
[[env.staging.durable_objects.bindings]]
name = "SPARK_METER"
class_name = "SparkMeter"

[[env.staging.migrations]]
tag = "v1-spark-meter"
new_sqlite_classes = ["SparkMeter"]

# ── PRODUCTION ────────────────────────────────────────────────────────────────────────────────────────
# Structurally mirrors [env.staging]; ids were all-zero placeholders until 2026-07-30; they are now real (the preflight blocked
# until an operator provisions the resources (see workers/api/wrangler.toml [env.prod] for the full
# reasoning). ~~NOT deployable — declared, not provisioned.~~ PROVISIONED AND DEPLOYED 2026-07-30; ids are real.
#
# DELIBERATELY ABSENT: EVIDENCE_FROM. Without it evidenceSender() stays a NotConfiguredSender, so a prod
# deploy cannot send a single evidence email until someone consciously turns sending on. That fail-closed
# posture is worth more than scope symmetry, and the preflight reports the sender separately.
[env.prod]
name = "shuddl-agents-prod"
workers_dev = false

[env.prod.vars]
ENVIRONMENT = "prod"
REFERRAL_BASE = "https://shuddl.tech"

[env.prod.triggers]
crons = ["0 1 * * *"]

# Same physical tenant DBs as the api worker (ids MUST match workers/api [env.prod]).
[[env.prod.d1_databases]]
binding = "TENANT_A_DB"
database_name = "shuddl-t-tenant-a-prod"
database_id = "7fb36070-86b3-4673-8bc9-de08ac0fa363"

[[env.prod.d1_databases]]
binding = "TENANT_B_DB"
database_name = "shuddl-t-tenant-b-prod"
database_id = "c6752655-df5b-4b8c-b150-95b04c990e99"

[[env.prod.d1_databases]]
binding = "CONTROL_DB"
database_name = "shuddl-control-prod"
database_id = "e91b8e7c-c878-437d-b25d-34530280fe85"

# 2026-08-01 audit C3 — claimed-tenant pool planes; ids VERBATIM from workers/api [env.prod] (same
# physical databases). Adding these voids the recorded preflight PASS for the prior config SHA (rule 1);
# the next preflight run checks two more bindings against resources that already exist.
[[env.prod.d1_databases]]
binding = "TENANT_POOL_01_DB"
database_name = "shuddl-t-pool-01-prod"
database_id = "dafdbec9-ebc5-4db7-9306-db96a0b3021f"

[[env.prod.d1_databases]]
binding = "TENANT_POOL_02_DB"
database_name = "shuddl-t-pool-02-prod"
database_id = "20564820-573d-425b-8803-41fc984096d0"

[[env.prod.r2_buckets]]
binding = "EVIDENCE"
bucket_name = "shuddl-evidence-prod"

[[env.prod.queues.consumers]]
queue = "shuddl-agent-triggers-prod"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "shuddl-agent-dlq-prod"

# REQ-169 — the reconciliation sweep's re-enqueue producer.
[[env.prod.queues.producers]]
queue = "shuddl-agent-triggers-prod"
binding = "AGENT_QUEUE"

# Cross-script DO → the PROD api worker (must be deployed first).
[[env.prod.durable_objects.bindings]]
name = "SHIPMENT_SEQ"
class_name = "ShipmentSequencer"
script_name = "shuddl-api-prod"

# The per-tenant Spark convenience meter, owned by THIS worker.
[[env.prod.durable_objects.bindings]]
name = "SPARK_METER"
class_name = "SparkMeter"

[[env.prod.migrations]]
tag = "v1-spark-meter"
new_sqlite_classes = ["SparkMeter"]
